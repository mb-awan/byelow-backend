name: CI/CD Pipeline for Unify Posts

on:
  push:
    branches:
      - main # Trigger on push to the main branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2 # Checkout the repository code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Install Docker Compose (if not already available)
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version  # Verify Docker Compose installation

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker images with Docker Compose
      - name: Build Docker images using Docker Compose
        run: |
          docker-compose -f docker-compose.yml build  # Builds images based on docker-compose.yml

      # Push Docker images to Docker Hub
      - name: Push Docker images to Docker Hub
        run: |
          docker push unifyposts/unify-posts-backend-api-server:latest
          docker push unifyposts/unify-posts-backend-worker:latest
          docker push unifyposts/unify-posts-backend-posts-scheduler:latest
          docker push unifyposts/unify-posts-backend-status-update-scheduler:latest

      # SSH into DigitalOcean Droplet and Deploy
      - name: SSH into DigitalOcean Droplet and Deploy
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.DO_SERVER_IP }}
          username: root # Use your SSH username (usually root)
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            cd /home/unify-posts  # path to your app directory
            docker-compose down  # Stop and remove the running containers
            docker-compose pull  # Pull the latest images from Docker Hub
            docker compose -f docker-compose.yml up -d --force-recreate  # Restart the services with the updated images

      # Optional failure notification (if required):
      # - name: Notify failure
      #   if: failure()
      #   uses: some-notification-action@v1
      #   with:
      #     message: 'Deployment failed. Please check the logs.'
