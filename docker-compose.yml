# Byelow Backend — API + AI service (DA/PA + Website Auditor on port 8000).
# Redis and DB are external (cloud / your host).
version: '3.8'

services:
  # Express API Server
  api-server:
    container_name: byelow-api-server
    build:
      context: .
      dockerfile: Dockerfile
    image: byelow/backend-api-server:latest
    ports:
      - '4000:4000'
    env_file:
      - .env.production
    volumes:
      - .env.production:/usr/src/app/.env.production
    depends_on:
      - ai-service
    networks:
      - app-network

  # AI Service — single FastAPI app: DA/PA checker + Website Auditor (port 8000)
  ai-service:
    container_name: byelow-ai-service
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    image: byelow/ai-service:latest
    ports:
      - '8000:8000'
    env_file:
      - .env.production
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
