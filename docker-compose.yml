# Byelow Backend — API + AI service. Redis and DB are external (cloud / your host).
version: '3.8'

services:
  # Express API Server
  api-server:
    container_name: byelow-api-server
    build:
      context: .
      dockerfile: Dockerfile
    image: byelow/backend-api-server:latest
    ports:
      - '4000:4000'
    env_file:
      - .env.production
    volumes:
      - .env.production:/usr/src/app/.env.production
    depends_on:
      - ai-service
    networks:
      - app-network

  # AI Service (DA/PA checker — FastAPI)
  ai-service:
    container_name: byelow-ai-service
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    image: byelow/ai-service:latest
    ports:
      - '8000:8000'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
